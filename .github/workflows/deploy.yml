name: Deploy to all-inkl

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run, only list what would be transferred and deleted"
        type: boolean
        default: false

concurrency:
  group: deploy-all-inkl
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Check export
        run: |
          test -f out/index.html
          test -f out/api/contact.php
          test -f out/impressum/index.html
          test -f out/datenschutz/index.html
          echo "Export contains $(find out -name '*.html' | wc -l) HTML pages"

      - name: Upload via rsync
        uses: easingthemes/ssh-deploy@v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          SOURCE: out/
          TARGET: ${{ secrets.SSH_TARGET }}
          ARGS: ${{ inputs.dry_run && '-rltgoDzvO --delete --dry-run' || '-rltgoDzvO --delete' }}
